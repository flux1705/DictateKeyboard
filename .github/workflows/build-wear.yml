
name: Build Dictate Keyboard APKs

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Build Phone and Wear APK
        run: |
          chmod +x gradlew
          ./gradlew :app:assembleDebug :wear:assembleDebug --stacktrace

      - name: Upload Phone APK
        uses: actions/upload-artifact@v4
        with:
          name: DictateKeyboard-Phone
          path: app/build/outputs/apk/**/*.apk
          if-no-files-found: error

      - name: Upload Wear APK
        uses: actions/upload-artifact@v4
        with:
          name: DictateKeyboard-WearOS
          path: wear/build/outputs/apk/**/*.apk
          if-no-files-found: error
